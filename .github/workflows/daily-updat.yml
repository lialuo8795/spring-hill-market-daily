name: Daily Market Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate daily page
        run: |
          export TZ='America/Chicago'
          DATE=$(date +'%Y-%m-%d-%H-%M')
          mkdir -p daily

          cat <<EOF > daily/$DATE.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Spring Hill Market Daily - $DATE</title>
            <style>
              body {
                font-family: Arial, Helvetica, sans-serif;
                background: #f6f7fb;
                color: #1f2937;
                margin: 0;
                padding: 0;
              }

              .container {
                max-width: 920px;
                margin: 40px auto;
                padding: 0 20px 60px;
              }

              .topbar {
                margin-bottom: 20px;
              }

              .topbar a {
                text-decoration: none;
                color: #1d4ed8;
                font-weight: bold;
              }

              .hero {
                background: linear-gradient(135deg, #0f172a, #1d4ed8);
                color: white;
                border-radius: 18px;
                padding: 34px 30px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.12);
                margin-bottom: 24px;
              }

              .hero h1 {
                margin: 0 0 10px;
                font-size: 40px;
              }

              .hero p {
                margin: 0;
                font-size: 18px;
                color: rgba(255,255,255,0.9);
              }

              .warning {
                background: #fff7d6;
                border-left: 6px solid #eab308;
                padding: 16px 18px;
                border-radius: 10px;
                margin: 24px 0 30px;
                line-height: 1.7;
              }

              .section-title {
                font-size: 28px;
                margin: 0 0 18px;
              }

              .news-card {
                background: white;
                border-radius: 14px;
                padding: 22px;
                margin-bottom: 18px;
                box-shadow: 0 4px 14px rgba(0,0,0,0.05);
              }

              .news-card h2 {
                margin: 0 0 14px;
                font-size: 24px;
                color: #111827;
              }

              .line {
                margin: 8px 0;
                line-height: 1.7;
              }

              .label {
                font-weight: bold;
              }

              .footer {
                margin-top: 36px;
                color: #6b7280;
                font-size: 14px;
                text-align: center;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="topbar">
                <a href="../index.html">← Back to Home</a>
              </div>

              <div class="hero">
                <h1>Spring Hill Market Daily</h1>
                <p>Daily AI-selected US market news summaries · $DATE</p>
              </div>

              <div class="warning">
                <strong>Important:</strong> This content is for informational purposes only and does not constitute investment advice. Investment involves risk. Please consult a qualified financial professional before making any investment decisions.
                <br><br>
                <strong>重要提示：</strong>本内容仅供信息参考，不构成投资建议。投资有风险，请在做出任何投资决策前咨询专业金融人士。
              </div>

              <h2 class="section-title">Top 5 Market News</h2>

              <div class="news-card">
                <h2>1. Fed outlook remains uncertain</h2>
                <div class="line"><span class="label">EN:</span> Markets remain cautious as Fed signals mixed direction.</div>
                <div class="line"><span class="label">CN:</span> 美联储政策不确定，市场保持谨慎。</div>
              </div>

              <div class="news-card">
                <h2>2. AI stocks continue strong momentum</h2>
                <div class="line"><span class="label">EN:</span> AI sector continues to attract investment.</div>
                <div class="line"><span class="label">CN:</span> 人工智能板块持续吸引资金。</div>
              </div>

              <div class="news-card">
                <h2>3. Oil prices fluctuate</h2>
                <div class="line"><span class="label">EN:</span> Energy market shows volatility.</div>
                <div class="line"><span class="label">CN:</span> 能源市场波动加剧。</div>
              </div>

              <div class="news-card">
                <h2>4. Job market slows slightly</h2>
                <div class="line"><span class="label">EN:</span> Hiring pace shows signs of cooling.</div>
                <div class="line"><span class="label">CN:</span> 就业增长略有放缓。</div>
              </div>

              <div class="news-card">
                <h2>5. Global markets mixed</h2>
                <div class="line"><span class="label">EN:</span> International markets show mixed performance.</div>
                <div class="line"><span class="label">CN:</span> 全球市场表现分化。</div>
              </div>

              <div class="footer">
                Spring Hill Market Daily · Generated automatically
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Update homepage
        run: |
          LATEST_FILE=$(ls -t daily/*.html | head -n 1)
          LATEST_BASENAME=$(basename "$LATEST_FILE")

          cat <<EOF > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Spring Hill Market Daily</title>
            <style>
              body {
                font-family: Arial, Helvetica, sans-serif;
                background: #f6f7fb;
                color: #1f2937;
                margin: 0;
                padding: 0;
              }

              .container {
                max-width: 920px;
                margin: 40px auto;
                padding: 0 20px 60px;
              }

              .hero {
                background: linear-gradient(135deg, #0f172a, #1d4ed8);
                color: white;
                border-radius: 18px;
                padding: 34px 30px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.12);
                margin-bottom: 24px;
              }

              .hero h1 {
                margin: 0 0 10px;
                font-size: 40px;
              }

              .hero p {
                margin: 0;
                font-size: 18px;
                color: rgba(255,255,255,0.9);
              }

              .warning {
                background: #fff7d6;
                border-left: 6px solid #eab308;
                padding: 16px 18px;
                border-radius: 10px;
                margin: 24px 0 30px;
                line-height: 1.7;
              }

              .card {
                background: white;
                border-radius: 14px;
                padding: 24px;
                margin-bottom: 18px;
                box-shadow: 0 4px 14px rgba(0,0,0,0.05);
              }

              .card h2 {
                margin: 0 0 14px;
                font-size: 24px;
              }

              .card a {
                text-decoration: none;
                color: #1d4ed8;
                font-weight: bold;
              }

              .footer {
                margin-top: 36px;
                color: #6b7280;
                font-size: 14px;
                text-align: center;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="hero">
                <h1>Spring Hill Market Daily</h1>
                <p>Daily AI-selected US market news summaries</p>
              </div>

              <div class="warning">
                <strong>Important:</strong> This content is for informational purposes only and does not constitute investment advice. Investment involves risk. Please consult a qualified financial professional before making any investment decisions.
                <br><br>
                <strong>重要提示：</strong>本内容仅供信息参考，不构成投资建议。投资有风险，请在做出任何投资决策前咨询专业金融人士。
              </div>

              <div class="card">
                <h2>Latest Report</h2>
                <p><a href="daily/$LATEST_BASENAME">Open latest market daily →</a></p>
              </div>

              <div class="card">
                <h2>About</h2>
                <p>This website publishes automatically generated daily market summaries.</p>
              </div>

              <div class="footer">
                Spring Hill Market Daily · Home
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Daily update" || echo "No changes"
          git push
