name: Daily AI Market Update

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Generate AI market content
        run: |
          export TZ='America/Chicago'
          DATE=$(date +'%Y-%m-%d-%H-%M')

          mkdir -p daily

          echo "Calling OpenAI..."

          RESPONSE=$(curl https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d '{
              "model": "gpt-4.1-mini",
              "input": "Write 5 concise US market news summaries. Each item must include EN and CN. Format as numbered list."
            }')

          CONTENT=$(echo $RESPONSE | jq -r '.output[0].content[0].text')

          echo "<!DOCTYPE html>" > daily/$DATE.html
          echo "<html><head><meta charset='UTF-8'><title>Market</title></head><body>" >> daily/$DATE.html
          echo "<h1>Spring Hill Market Daily - $DATE</h1>" >> daily/$DATE.html
          name: Daily AI Market Update

