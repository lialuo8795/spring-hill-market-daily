- name: Generate AI market content
  run: |
    sudo apt-get update
    sudo apt-get install -y jq

    export TZ='America/Chicago'
    DATE=$(date +'%Y-%m-%d-%H-%M')

    mkdir -p daily

    echo "Calling OpenAI..."

    RESPONSE=$(curl https://api.openai.com/v1/responses \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
      -d '{
        "model": "gpt-4.1-mini",
        "input": "Write 5 concise US market news summaries. Each item must include EN and CN."
      }')

    CONTENT=$(echo $RESPONSE | jq -r '.output[0].content[0].text')

    echo "Generating HTML..."

    cat <<EOF > daily/$DATE.html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spring Hill Market Daily</title>
<style>
body { font-family: Arial; background:#f6f7fb; padding:20px; }
.container { max-width:800px; margin:auto; }
.card { background:white; padding:20px; margin:15px 0; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.05);}
h1 { text-align:center; }
</style>
</head>
<body>
<div class="container">
<h1>Spring Hill Market Daily - $DATE</h1>
<pre>$CONTENT</pre>
</div>
</body>
</html>
EOF
