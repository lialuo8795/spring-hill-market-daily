- name: Create file
  run: |
    DATE=$(date '+%Y-%m-%d-%H-%M')
    mkdir -p daily

    echo "<!DOCTYPE html>" > daily/$DATE.html
    echo "<html><head><meta charset='UTF-8'><title>Market</title>" >> daily/$DATE.html

    echo "<style>
    body { font-family: Arial; background:#f5f7fa; margin:40px;}
    .card {background:white; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    h1 {color:#1a73e8;}
    </style>" >> daily/$DATE.html

    echo "</head><body>" >> daily/$DATE.html

    echo "<h1>Spring Hill Market Daily - $DATE</h1>" >> daily/$DATE.html

    echo "<div class='card'>" >> daily/$DATE.html
    echo "<h2>Top 5 Market News</h2>" >> daily/$DATE.html

    echo "<p><b>1. Fed outlook remains uncertain</b><br>EN: Markets remain cautious.<br>CN: 市场保持谨慎。</p>" >> daily/$DATE.html
    echo "<p><b>2. AI stocks strong</b><br>EN: AI attracts investment.<br>CN: AI吸引资金。</p>" >> daily/$DATE.html
    echo "<p><b>3. Oil fluctuates</b><br>EN: Energy volatile.<br>CN: 能源波动。</p>" >> daily/$DATE.html
    echo "<p><b>4. Jobs slow</b><br>EN: Hiring cools.<br>CN: 就业放缓。</p>" >> daily/$DATE.html
    echo "<p><b>5. Markets mixed</b><br>EN: Global mixed.<br>CN: 全球分化。</p>" >> daily/$DATE.html

    echo "</div>" >> daily/$DATE.html

    echo "</body></html>" >> daily/$DATE.html
