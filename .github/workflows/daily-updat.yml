name: Daily Market Update

on:
  workflow_dispatch:

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create file
        run: |
          DATE=$(date +'%Y-%m-%d-%H-%M')
          mkdir -p daily
          echo "<h1>$DATE</h1>" > daily/$DATE.html
          echo "<p>Auto generated page</p>" >> daily/$DATE.html

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "update" || echo "no change"
          git push
